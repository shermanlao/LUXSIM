<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" role="img" aria-labelledby="t d">
  <title id="t">Isoline levels and presets</title>
  <desc id="d">Auto or Custom isoline levels, with built-in presets 100 / 200 / 300 / 500 and 300 / 500 / 750.</desc>
  <rect width="840" height="260" fill="#0f1c24"/>
  <g font-family="Inter, Segoe UI, sans-serif">
    <text x="20" y="26" fill="#c5d0d6" font-size="13">Isoline levels / 等照度線數值</text>
    <g transform="translate(20,40)">
      <rect x="0" y="0" width="92" height="28" rx="4" fill="#162630" stroke="#4a6270"/>
      <text x="46" y="19" text-anchor="middle" fill="#e8eef2" font-size="11">Auto / 自動</text>
      <rect x="98" y="0" width="108" height="28" rx="4" fill="#c45c26"/>
      <text x="152" y="19" text-anchor="middle" fill="#f5f7f8" font-size="11">Custom / 自訂</text>
    </g>
    <g transform="translate(20,80)">
      <rect x="0" y="0" width="58" height="24" rx="3" fill="#12202a" stroke="#4a6270"/>
      <text x="29" y="16" text-anchor="middle" fill="#e8eef2" font-size="11">100</text>
      <text x="66" y="16" fill="#8aa0ad" font-size="10">lx</text>
      <rect x="86" y="0" width="58" height="24" rx="3" fill="#12202a" stroke="#4a6270"/>
      <text x="115" y="16" text-anchor="middle" fill="#e8eef2" font-size="11">200</text>
      <text x="152" y="16" fill="#8aa0ad" font-size="10">lx</text>
      <rect x="172" y="0" width="58" height="24" rx="3" fill="#12202a" stroke="#4a6270"/>
      <text x="201" y="16" text-anchor="middle" fill="#e8eef2" font-size="11">300</text>
      <text x="238" y="16" fill="#8aa0ad" font-size="10">lx</text>
      <rect x="258" y="0" width="58" height="24" rx="3" fill="#12202a" stroke="#4a6270"/>
      <text x="287" y="16" text-anchor="middle" fill="#e8eef2" font-size="11">500</text>
      <text x="324" y="16" fill="#8aa0ad" font-size="10">lx</text>
    </g>
    <text x="20" y="128" fill="#c5d0d6" font-size="13">Presets / 預設</text>
    <g transform="translate(20,140)">
      <rect x="0" y="0" width="220" height="26" rx="3" fill="#12202a" stroke="#4a6270"/>
      <text x="10" y="18" fill="#e8eef2" font-size="11">100 / 200 / 300 / 500</text>
      <rect x="228" y="0" width="78" height="26" rx="3" fill="#162630" stroke="#4a6270"/>
      <text x="267" y="18" text-anchor="middle" fill="#e8eef2" font-size="11">Apply / 套用</text>
    </g>
    <text x="20" y="192" fill="#8aa0ad" font-size="12">Built-in starters: 100 / 200 / 300 / 500 and 300 / 500 / 750. Save, rename, or delete your own presets. Built-in starters are not overwritten.</text>
    <text x="20" y="214" fill="#8aa0ad" font-size="12">內建起始預設為 100／200／300／500 與 300／500／750。可儲存、重新命名或刪除自己的預設；內建預設不會被覆蓋。</text>
    <text x="20" y="240" fill="#8aa0ad" font-size="12">Default remains Auto. Empty or invalid custom lists are refused. Top, 3D, and Full PDF 2D isolux figures use the same levels.</text>
  </g>
</svg>
