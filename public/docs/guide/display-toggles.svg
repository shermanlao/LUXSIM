<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" role="img" aria-labelledby="t d">
  <title id="t">Greyscale, False colour, Isolines and Value labels</title>
  <desc id="d">Greyscale and False colour are exclusive. Isolines and Value labels are the same kind of button and can overlay either mode.</desc>
  <rect width="840" height="220" fill="#0f1c24"/>
  <g font-family="Inter, Segoe UI, sans-serif">
    <text x="20" y="28" fill="#c5d0d6" font-size="13">3D display</text>
    <g transform="translate(20,42)">
      <rect x="0" y="0" width="92" height="30" rx="4" fill="#162630" stroke="#4a6270"/>
      <text x="46" y="20" text-anchor="middle" fill="#e8eef2" font-size="12">Greyscale</text>
      <rect x="98" y="0" width="108" height="30" rx="4" fill="#c45c26"/>
      <text x="152" y="20" text-anchor="middle" fill="#f5f7f8" font-size="12">False colour</text>
      <rect x="216" y="0" width="84" height="30" rx="4" fill="#c45c26"/>
      <text x="258" y="20" text-anchor="middle" fill="#f5f7f8" font-size="12">Isolines</text>
      <rect x="306" y="0" width="108" height="30" rx="4" fill="#c45c26"/>
      <text x="360" y="20" text-anchor="middle" fill="#f5f7f8" font-size="12">Value labels</text>
    </g>
    <text x="20" y="100" fill="#8aa0ad" font-size="12">Greyscale and False colour are a pair of toggles. Isolines and Value labels use the same button and can overlay either mode.</text>
    <text x="20" y="120" fill="#8aa0ad" font-size="12">灰階與偽色互相切換；等照度線與數值圖是同一種按鈕，可疊加在灰階或偽色上。</text>
    <g transform="translate(20,140)">
      <rect x="0" y="0" width="200" height="60" rx="6" fill="#12202a" stroke="#2a3842"/>
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#141414"/>
          <stop offset="1" stop-color="#e8e8e8"/>
        </linearGradient>
        <linearGradient id="c1" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#1a3370"/>
          <stop offset="0.5" stop-color="#2db34a"/>
          <stop offset="1" stop-color="#f0d030"/>
        </linearGradient>
      </defs>
      <rect x="12" y="12" width="80" height="36" fill="url(#g1)"/>
      <text x="52" y="54" text-anchor="middle" fill="#c5d0d6" font-size="10">Greyscale</text>
      <rect x="108" y="12" width="80" height="36" fill="url(#c1)"/>
      <text x="148" y="54" text-anchor="middle" fill="#c5d0d6" font-size="10">False colour</text>
    </g>
  </g>
</svg>
