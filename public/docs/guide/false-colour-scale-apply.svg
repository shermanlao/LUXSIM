<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" role="img" aria-labelledby="t d">
  <title id="t">Apply to change false colour</title>
  <desc id="d">Adjusting the false-colour scale bar updates the bar immediately. The plan waits until you press Apply. A compact prompt stands on the plan viewport and does not cover the scale bar.</desc>
  <rect width="840" height="280" fill="#0f1c24"/>
  <g font-family="Inter, Segoe UI, sans-serif">
    <rect x="20" y="16" width="800" height="176" rx="6" fill="#0a1218" stroke="#2a3842"/>
    <defs>
      <linearGradient id="fcbar" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#000000"/>
        <stop offset="0.125" stop-color="#AA01FE"/>
        <stop offset="0.25" stop-color="#0200FF"/>
        <stop offset="0.375" stop-color="#02FFFA"/>
        <stop offset="0.5" stop-color="#03FD05"/>
        <stop offset="0.625" stop-color="#FBFF00"/>
        <stop offset="0.75" stop-color="#FCAA02"/>
        <stop offset="0.875" stop-color="#FF0001"/>
        <stop offset="1" stop-color="#FFFFFF"/>
      </linearGradient>
    </defs>
    <rect x="40" y="36" width="760" height="108" fill="#163038"/>
    <rect x="292" y="62" width="256" height="68" rx="6" fill="rgba(15,23,29,0.94)" stroke="#2a3842"/>
    <text x="420" y="86" text-anchor="middle" fill="#e8eef2" font-size="12" font-weight="600">Apply to change false colour</text>
    <text x="420" y="104" text-anchor="middle" fill="#c5d0d6" font-size="12">套用以更改偽色</text>
    <rect x="372" y="110" width="96" height="14" rx="3" fill="#c45c26"/>
    <text x="420" y="121" text-anchor="middle" fill="#f5f7f8" font-size="9" font-weight="600">Apply / 套用</text>
    <rect x="20" y="196" width="800" height="68" rx="6" fill="#0a1218" stroke="#2a3842"/>
    <text x="36" y="216" fill="#e8eef2" font-size="10" font-weight="600" letter-spacing="0.06em">FALSE-COLOUR SCALE</text>
    <text x="668" y="216" fill="#8fa3ad" font-size="10">lx</text>
    <text x="698" y="216" fill="#c5d0d6" font-size="10">Reset</text>
    <rect x="736" y="204" width="70" height="16" rx="3" fill="#c45c26"/>
    <text x="771" y="216" text-anchor="middle" fill="#f5f7f8" font-size="9" font-weight="600">Apply / 套用</text>
    <rect x="80" y="226" width="680" height="10" rx="2" fill="url(#fcbar)" stroke="#3a5160"/>
    <text x="80" y="252" fill="#8fa3ad" font-size="9">0</text>
    <text x="760" y="252" text-anchor="end" fill="#8fa3ad" font-size="9">800</text>
  </g>
</svg>
